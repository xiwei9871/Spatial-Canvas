name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm run test:adapter
      - run: npm run test:bindings
      - run: npm run check
      - run: npm run schemas
      - run: npm run fixture
      - run: git diff --exit-code -- schemas examples
